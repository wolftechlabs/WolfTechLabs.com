<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfTechLabs - Project Intake</title>
    <style>
        body {
            background-color: #0d0d0f; /* Deep charcoal full-page background */
            color: #f4f4f6;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="wtl-configurator-card" style="background-color: #121214; border: 1px solid #4a4a4f; padding: 2rem; border-radius: 8px; color: #f4f4f6; width: 100%; max-width: 600px; box-shadow: 0 8px 24px rgba(0,0,0,0.6);">
    <h2 style="color: #9d4edd; margin-bottom: 1rem; border-bottom: 1px solid #2a2a2e; padding-bottom: 0.5rem;">Project Inquiry & Intake</h2>
    <form id="wtlIntakeForm">
        <!-- Mandatory Fields -->
        <div style="margin-bottom: 1.25rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #e0aaff;">Email Address *</label>
            <input type="email" name="clientEmail" required style="width: 100%; padding: 0.75rem; background-color: #1a1a1e; border: 1px solid #5a5a62; border-radius: 4px; color: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 1.25rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #e0aaff;">Project Description *</label>
            <textarea name="projectDesc" rows="4" required placeholder="Tell us what you're trying to build..." style="width: 100%; padding: 0.75rem; background-color: #1a1a1e; border: 1px solid #5a5a62; border-radius: 4px; color: #fff; box-sizing: border-box; resize: vertical;"></textarea>
        </div>

        <!-- Optional Dropdown Details -->
        <details style="margin-bottom: 1.5rem; background-color: #1a1a1e; padding: 0.75rem; border-radius: 4px; border: 1px solid #3a3a3e;">
            <summary style="cursor: pointer; color: #c77dff; font-weight: 600;">Optional Specifications (Material, Budget, Timeline)</summary>
            <div style="margin-top: 1rem;">
                <label style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #d8b4fe;">Preferred Material / Medium</label>
                <input type="text" name="optMaterial" placeholder="e.g., Basswood, PETG, Canvas, Leather" style="width: 100%; padding: 0.5rem; background-color: #121214; border: 1px solid #4a4a4f; border-radius: 4px; color: #fff; margin-bottom: 0.8rem; box-sizing: border-box;">
                
                <label style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #d8b4fe;">Target Timeline</label>
                <input type="text" name="optTimeline" placeholder="e.g., 2 weeks, Flexible" style="width: 100%; padding: 0.5rem; background-color: #121214; border: 1px solid #4a4a4f; border-radius: 4px; color: #fff; box-sizing: border-box;">
            </div>
        </details>

        <button type="submit" style="width: 100%; background-color: #7b2cbf; color: #fff; padding: 0.75rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s;">Submit Project Request</button>
    </form>
</div>

</body>
</html>
